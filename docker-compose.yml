
services:
  db:
    image: mysql:latest
    container_name: fag_quality_db
    environment:
      MYSQL_ROOT_PASSWORD: qualidade123
      MYSQL_DATABASE: fag_quality
      MYSQL_USER: marcelo
      MYSQL_PASSWORD: qualidade123
    ports:
      - 3306:3306
    volumes:
      - fag_quality:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pqualidade123"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fag_quality: